name: Codex Autopatch

on:
  issues:
    types: [labeled]

jobs:
  codex:
    if: github.event.label.name == 'codex'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install openai-codex CLI
        run: |
          # Install Rust (required for openai-codex)
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          
          # Install codex via cargo
          cargo install --git https://github.com/openai/codex.git codex-cli
          
      - name: Run Codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ github.event.issue.body }}" > /tmp/spec.md
          
          # Run codex diff command
          codex diff --model gpt-4o --prompt /tmp/spec.md src/ > patch.diff
          
          if [ -s patch.diff ]; then
            # Apply the patch
            git apply patch.diff
            
            # Configure git
            git config --global user.email "codex-bot@users.noreply.github.com"
            git config --global user.name "codex-bot"
            
            # Create and push branch
            BR="codex/issue-${{ github.event.issue.number }}-$(date +%s)"
            git checkout -b $BR
            git add .
            git commit -m "feat(codex): auto-patch for issue #${{ github.event.issue.number }}"
            git push -u origin $BR
            
            # Create PR using GitHub CLI
            gh pr create \
              --title "🤖 Codex Auto-patch: Issue #${{ github.event.issue.number }}" \
              --body "自動生成されたパッチです。\n\n関連Issue: #${{ github.event.issue.number }}" \
              --head $BR \
              --base main \
              --label "auto,codex"
          else
            echo "No changes generated by codex"
          fi 